name: pre-release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build from (e.g. main or feature/my-branch)
        required: true
      version:
        description: Release label (e.g. 1.3.0-beta.1). Stamped in csproj as a numeric mod-loader version.
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-mod.yml
    with:
      ref: ${{ inputs.branch }}
      version: ${{ inputs.version }}
      stable: false

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: package

      # Created only after a successful build, tagged at the exact commit that was built.
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          LABEL: ${{ needs.build.outputs.label }}
          ASSEMBLY_VERSION: ${{ needs.build.outputs.assembly_version }}
          SHA: ${{ needs.build.outputs.sha }}
          ZIP: package/${{ needs.build.outputs.zip }}
        run: |
          set -euo pipefail
          tag="v${LABEL}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists. Pick a new pre-release iteration."
            exit 1
          fi
          notes=$(cat <<EOF
          Built from \`${BRANCH}\` at ${SHA}

          Mod loader version: \`${ASSEMBLY_VERSION}\`
          Release label: \`${LABEL}\`

          Pre-release stage mapping: alpha → .1xx, beta → .2xx, rc → .3xx (xx = iteration).
          EOF
          )
          gh release create "$tag" "$ZIP" -R "$REPO" --target "$SHA" --prerelease --title "$tag" --notes "$notes"
