name: build-mod

# Shared build used by both release workflows: validates the version, runs the same checks as the
# Build workflow, then produces the shipped package (Debug + .mdb symbols) as a workflow artifact.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (branch, tag or SHA)
        required: true
        type: string
      version:
        description: Version label (e.g. 1.3.0, 1.3.0-beta.1, optionally prefixed with v)
        required: true
        type: string
      stable:
        description: Stable release. Requires X.Y.Z matching <Version> in the csproj; otherwise the csproj is stamped.
        required: false
        default: false
        type: boolean
    outputs:
      label:
        description: Normalized version label (no leading v)
        value: ${{ jobs.build.outputs.label }}
      assembly_version:
        description: Four-part numeric version seen by the mod loader
        value: ${{ jobs.build.outputs.assembly_version }}
      sha:
        description: Commit SHA that was built
        value: ${{ jobs.build.outputs.sha }}
      artifact:
        description: Name of the workflow artifact holding the zip
        value: ${{ jobs.build.outputs.artifact }}
      zip:
        description: File name of the zip inside the artifact
        value: ${{ jobs.build.outputs.zip }}

permissions:
  contents: read

env:
  MONO_VERSION: 6.12.0.206
  # From the Mono.Mono 6.12.0.206 winget manifest (microsoft/winget-pkgs).
  MONO_MSI_SHA256: 4125F57D97CFA88257915EDC969E913DE198CD8E22396A29849037479A0AC368
  MONO_MSI_URL: https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.206-x64-0.msi
  PACKAGE_DIR: C:\out\package
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: windows-2025
    outputs:
      label: ${{ steps.version.outputs.label }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      sha: ${{ steps.sha.outputs.sha }}
      artifact: mod-package
      zip: ${{ steps.zip.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve commit
        id: sha
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Normalize version
        id: version
        uses: ./.github/actions/normalize-mod-version
        with:
          version_input: ${{ inputs.version }}

      - name: Detect csproj
        id: csproj
        uses: ./.github/actions/detect-csproj

      - name: Check version against csproj
        shell: pwsh
        env:
          LABEL: ${{ steps.version.outputs.label }}
          CSPROJ: ${{ steps.csproj.outputs.csproj_name }}.csproj
          STABLE: ${{ inputs.stable }}
        run: |
          [xml]$proj = Get-Content -Raw -LiteralPath $env:CSPROJ
          $csprojVersion = $proj.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($env:STABLE -eq 'true') {
            if ($env:LABEL -notmatch '^\d+\.\d+\.\d+$') {
              throw "Stable releases need a vX.Y.Z tag (got '$env:LABEL'). Use the pre-release workflow for alpha/beta/rc builds."
            }
            if ($csprojVersion -ne $env:LABEL) {
              throw "Tag version $env:LABEL does not match <Version>$csprojVersion</Version> in $env:CSPROJ. Bump the csproj on the release commit first."
            }
          }
          elseif (($env:LABEL -replace '-.*$', '') -ne $csprojVersion) {
            Write-Output "::warning::Pre-release $env:LABEL does not share a base version with <Version>$csprojVersion</Version> in $env:CSPROJ."
          }

      - name: Stamp pre-release version into csproj
        if: ${{ !inputs.stable }}
        uses: KageKirin/set-csproj-version@d450aed0cc1a1e9d04c47d017a59c05287202007 # v1.0.0
        with:
          file: ${{ steps.csproj.outputs.csproj_name }}.csproj
          version: ${{ steps.version.outputs.assembly_version }}
          regex: '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)\.(?<revision>0|[1-9]\d*)$'

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        env:
          CSPROJ: ${{ steps.csproj.outputs.csproj_name }}.csproj
        run: |
          dotnet restore $env:CSPROJ
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet restore Zeepkist.MedalTimes.Tests/Zeepkist.MedalTimes.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Test restore failed' }

      - name: Verify generated client
        shell: pwsh
        run: |
          ./Generate-GraphQLClient.ps1
          git diff --exit-code -- GraphQL/MedalTimesClient.Client.cs
          if ($LASTEXITCODE -ne 0) { throw 'Generated client differs from checked-in client' }

      - name: Test
        shell: pwsh
        run: |
          dotnet test Zeepkist.MedalTimes.Tests/Zeepkist.MedalTimes.Tests.csproj --no-restore -c Debug
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Publish
        shell: pwsh
        env:
          CSPROJ: ${{ steps.csproj.outputs.csproj_name }}.csproj
        run: |
          dotnet publish $env:CSPROJ --no-restore -c Debug -o $env:PACKAGE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }

      - name: Verify package
        shell: pwsh
        run: ./Verify-Package.ps1 $env:PACKAGE_DIR

      - name: Get AssemblyName
        id: asm
        uses: ./.github/actions/get-assembly-name
        with:
          csproj: ${{ steps.csproj.outputs.csproj_name }}

      - name: Restore cached Mono installer
        id: mono-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\mono-installer
          key: mono-msi-${{ env.MONO_VERSION }}-x64

      - name: Download Mono installer
        if: steps.mono-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mono-installer'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri $env:MONO_MSI_URL -OutFile (Join-Path $dir 'mono.msi')

      - name: Install Mono
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'mono-installer\mono.msi'
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
          if ($hash -ne $env:MONO_MSI_SHA256) { throw "Mono installer hash mismatch: $hash" }
          $log = Join-Path $env:RUNNER_TEMP 'mono-install.log'
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*', "`"$log`"")
          if ($proc.ExitCode -notin 0, 3010) { Get-Content $log -Tail 50; throw "Mono install failed with exit code $($proc.ExitCode)" }
          if (-not (Test-Path 'C:\Program Files\Mono\bin\pdb2mdb.bat')) { throw 'pdb2mdb.bat not found after Mono install' }

      - name: PDB2MDB
        shell: pwsh
        env:
          ASSEMBLY_NAME: ${{ steps.asm.outputs.assembly_name }}
        run: |
          $dll = Join-Path $env:PACKAGE_DIR "$env:ASSEMBLY_NAME.dll"
          & 'C:\Program Files\Mono\bin\pdb2mdb.bat' $dll
          if ($LASTEXITCODE -ne 0) { throw 'pdb2mdb failed' }
          if (-not (Test-Path -LiteralPath "$dll.mdb")) { throw "pdb2mdb did not produce $dll.mdb" }

      - name: Zip build
        id: zip
        shell: pwsh
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          $name = "Zeepkist.MedalTimes-$env:LABEL.zip"
          $dst = Join-Path 'C:\out' $name
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path "$env:PACKAGE_DIR\*" -DestinationPath $dst -Force
          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$dst" >> $env:GITHUB_OUTPUT

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-package
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 14
