name: release

on:
  release:
    types: [published]

env:
  GAME_ID: 3213 # Zeepkist
  MOD_ID: 2095268 # Medal Times

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event.release.prerelease != true
    uses: ./.github/workflows/build-mod.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name }}
      version: ${{ github.event.release.tag_name }}
      stable: true

  upload:
    needs: build
    runs-on: ubuntu-26.04
    # Add required reviewers to this environment (Settings → Environments) to gate mod.io uploads.
    environment: modio
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: package

      - name: Upload mod to mod.io
        uses: Thundernerd/upload-mod-to-modio@306d470f2b096a40315bfda2e4cb39c7ef9e4de4 # v1.0.0
        with:
          bearer-token: ${{ secrets.MODIO_BEARER }}
          game-id: ${{ env.GAME_ID }}
          mod-id: ${{ env.MOD_ID }}
          active: true
          changelog: ${{ github.event.release.body }}
          file-path: package/${{ needs.build.outputs.zip }}
          version: ${{ needs.build.outputs.label }}
